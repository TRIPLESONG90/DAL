<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>실습 ② CNN 필터</title>
<style>
  :root {--red:#E10800;--ink:#F3F3F4;--dim:#A9ACB2;--line:#3A3C41;--bg:#16171A;--panel:#1F2023;--surface:#27292D}
  * {box-sizing:border-box}
  body {margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
  header {border-top:4px solid var(--red);padding:20px 28px 10px}
  h1 {margin:0;font-size:24px} header p {margin:6px 0 0;color:var(--dim);font-size:15px}
  main {display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:16px 28px 28px}
  @media (max-width:1000px) {main {grid-template-columns:1fr}}
  section {background:var(--panel);border:1px solid var(--line);padding:16px 18px}
  h2 {margin:0 0 10px;font-size:14px;letter-spacing:.08em;color:var(--red)}
  .pair {display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pair figure {margin:0} .pair figcaption {font-size:13px;color:var(--dim);margin-top:6px}
  canvas {width:100%;display:block;background:#000;image-rendering:pixelated}
  #src {cursor:crosshair}
  .presets {display:flex;flex-wrap:wrap;gap:6px}
  button, .file {background:var(--surface);color:var(--ink);border:1px solid #4B4D53;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer}
  button:hover, .file:hover {border-color:#8A8C92} button.on {background:var(--red);border-color:var(--red)}
  .kernel {display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin:12px 0 4px}
  .kernel input {width:64px;height:46px;text-align:center;font:600 18px Consolas,monospace;background:#111317;color:var(--ink);border:1px solid #4B4D53}
  .opts {display:grid;gap:8px;margin-top:12px;font-size:14px;color:#C3C6CC}
  .opts label {display:flex;gap:8px;align-items:center;cursor:pointer}
  .calc {font:14px/1.7 Consolas,monospace;color:#C3C6CC;white-space:pre;overflow-x:auto;background:#111317;padding:10px 12px;margin-top:6px}
  .calc b {color:var(--red)}
  .tip {font-size:14px;line-height:1.6;color:#C3C6CC}
  .file input {display:none}
</style></head><body>
<header><h1>실습 ② CNN 필터 — 작은 필터로 무늬 찾기</h1><p>3×3 필터를 이미지 위로 밀면서 <b>곱하고 더한 값</b>으로 새 이미지(특징 지도)를 만듭니다. CNN은 이런 필터 수백 개의 숫자를 학습으로 정합니다.</p></header>
<main>
  <div>
    <section><div class="pair">
      <figure><canvas id="src" width="256" height="256"></canvas><figcaption>입력 이미지 — 클릭하면 그 자리의 계산을 보여 줍니다</figcaption></figure>
      <figure><canvas id="out" width="256" height="256"></canvas><figcaption id="outcap">특징 지도 (필터를 적용한 결과)</figcaption></figure>
    </div></section>
    <section style="margin-top:20px"><h2>클릭한 자리의 계산</h2><div class="calc" id="calc">입력 이미지를 클릭해 보세요.</div></section>
  </div>
  <aside>
    <section><h2>1. 이미지</h2>
      <div class="presets"><button id="sample">예시 부품 이미지</button><label class="file">내 사진 열기<input id="upload" type="file" accept="image/*"></label></div>
      <p class="tip">사진은 이 PC 안에서만 처리되며 어디에도 전송되지 않습니다.</p>
    </section>
    <section style="margin-top:20px"><h2>2. 필터 (3×3)</h2>
      <div class="presets" id="presets"></div>
      <div class="kernel" id="kernel"></div>
      <p class="tip">숫자를 직접 바꿔 보세요. 예: 가운데만 1이면 원본 그대로입니다.</p>
      <div class="opts">
        <label><input id="relu" type="checkbox"> ReLU — 음수는 0으로 (CNN에서 필터 다음에 쓰는 단계)</label>
        <label><input id="pool" type="checkbox"> 최대 풀링 2×2 — 크기를 절반으로, 가장 강한 값만 남기기</label>
      </div>
    </section>
  </aside>
</main>
<script>
const PRESETS = {
  '원본': [0,0,0, 0,1,0, 0,0,0],
  '세로 경계': [-1,0,1, -2,0,2, -1,0,1],
  '가로 경계': [-1,-2,-1, 0,0,0, 1,2,1],
  '모든 경계': [-1,-1,-1, -1,8,-1, -1,-1,-1],
  '흐리게': [1,1,1, 1,1,1, 1,1,1],
  '선명하게': [0,-1,0, -1,5,-1, 0,-1,0],
};
const $ = id => document.getElementById(id);
const S = 256;
let gray = new Float32Array(S * S), kernel = PRESETS['세로 경계'].slice(), active = '세로 경계';

function drawSample() {
  const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.fillStyle = '#1e1e1e'; g.fillRect(0, 0, S, S);
  g.fillStyle = '#8c8c8c'; g.fillRect(36, 60, 120, 150);                     // 판재
  g.fillStyle = '#d8d8d8'; g.beginPath(); g.arc(178, 92, 46, 0, 7); g.fill(); // 원형 부품
  g.fillStyle = '#1e1e1e'; g.beginPath(); g.arc(178, 92, 16, 0, 7); g.fill(); // 구멍
  g.fillStyle = '#bdbdbd'; g.beginPath(); g.moveTo(170, 230); g.lineTo(236, 230); g.lineTo(203, 160); g.fill();
  g.strokeStyle = '#f0f0f0'; g.lineWidth = 3; g.beginPath(); g.moveTo(52, 190); g.lineTo(128, 120); g.stroke(); // 흠집
  for (let y = 70; y < 200; y += 22) for (let x = 48; x < 150; x += 26) { g.fillStyle = '#6a6a6a'; g.fillRect(x, y, 6, 6); }
  load(c);
}
function load(img) {
  const c = $('src'), g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
  const r = Math.min(S / (img.width || S), S / (img.height || S)), w = (img.width || S) * r, h = (img.height || S) * r;
  g.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
  const d = g.getImageData(0, 0, S, S).data;
  for (let i = 0; i < S * S; i++) { gray[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = gray[i]; }
  g.putImageData(new ImageData(d, S, S), 0, 0);
  render();
}
const sum = k => k.reduce((a, b) => a + b, 0);
function conv(x, y) {
  let v = 0;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const xx = Math.min(S - 1, Math.max(0, x + i)), yy = Math.min(S - 1, Math.max(0, y + j));
    v += gray[yy * S + xx] * kernel[(j + 1) * 3 + (i + 1)];
  }
  const s = sum(kernel); return s > 1 ? v / s : v;   // 흐리게처럼 합이 큰 필터는 평균으로
}
function render() {
  const relu = $('relu').checked, pool = $('pool').checked;
  let map = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const v = conv(x, y); map[y * S + x] = relu ? Math.max(0, v) : v; }
  let W = S;
  if (pool) {
    const P = new Float32Array((S / 2) * (S / 2));
    for (let y = 0; y < S / 2; y++) for (let x = 0; x < S / 2; x++)
      P[y * (S / 2) + x] = Math.max(map[(2 * y) * S + 2 * x], map[(2 * y) * S + 2 * x + 1], map[(2 * y + 1) * S + 2 * x], map[(2 * y + 1) * S + 2 * x + 1]);
    map = P; W = S / 2;
  }
  const c = $('out'); c.width = c.height = W; const g = c.getContext('2d'), im = g.createImageData(W, W);
  const signed = !relu && kernel.some(v => v < 0) && sum(kernel) <= 1;
  for (let i = 0; i < W * W; i++) {
    const v = signed ? 128 + map[i] / 4 : map[i];
    const p = Math.max(0, Math.min(255, v));
    im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = p; im.data[i * 4 + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  $('outcap').textContent = `특징 지도 ${W}×${W}` + (signed ? ' — 회색 = 0, 밝을수록 +, 어두울수록 −' : '') + (pool ? ' · 풀링으로 절반 크기' : '');
}
function buildKernel() {
  $('kernel').innerHTML = kernel.map((v, i) => `<input data-i="${i}" value="${v}" inputmode="numeric">`).join('');
  $('presets').innerHTML = Object.keys(PRESETS).map(k => `<button class="${k === active ? 'on' : ''}" data-k="${k}">${k}</button>`).join('');
}
$('presets').onclick = e => { const k = e.target.dataset.k; if (!k) return; active = k; kernel = PRESETS[k].slice(); buildKernel(); render(); };
$('kernel').oninput = e => { const i = e.target.dataset.i, v = Number(e.target.value); if (!isNaN(v)) { kernel[i] = v; active = ''; $('presets').querySelectorAll('button').forEach(b => b.classList.remove('on')); render(); } };
$('relu').onchange = render; $('pool').onchange = render;
$('sample').onclick = drawSample;
$('upload').onchange = e => { const f = e.target.files[0]; if (!f) return; const img = new Image(); img.onload = () => load(img); img.src = URL.createObjectURL(f); };
$('src').onclick = e => {
  const r = e.target.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * S), y = Math.floor((e.clientY - r.top) / r.height * S);
  const patch = [];
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) patch.push(Math.round(gray[Math.min(S - 1, Math.max(0, y + j)) * S + Math.min(S - 1, Math.max(0, x + i))]));
  const row = (a, i) => a.slice(i * 3, i * 3 + 3).map(v => String(v).padStart(4)).join('');
  const terms = patch.map((p, i) => `${p}×${kernel[i]}`).join(' + ');
  const raw = patch.reduce((s, p, i) => s + p * kernel[i], 0), s = sum(kernel);
  $('calc').innerHTML = `위치 (${x}, ${y})\n\n 이미지 조각      필터\n${[0, 1, 2].map(i => row(patch, i) + '      ' + row(kernel, i)).join('\n')}\n\n` +
    `${terms}\n= <b>${raw}</b>${s > 1 ? ` ÷ ${s} = <b>${(raw / s).toFixed(1)}</b>` : ''}` +
    (raw > 0 ? '  → 양수: 필터가 찾는 무늬가 있음' : raw < 0 ? '  → 음수: 반대 방향 무늬' : '  → 0: 무늬 없음(평평함)');
};
buildKernel(); drawSample();
</script></body></html>
